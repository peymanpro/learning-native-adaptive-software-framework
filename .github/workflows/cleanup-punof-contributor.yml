name: Cleanup accidental GitHub attribution

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite accidental commit attribution
        env:
          TARGET_EMAIL: 111855254+peymanpro@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "Peyman Salimi"
          git config user.email "$TARGET_EMAIL"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            old_email="you@company.com"
            new_name="Peyman Salimi"
            new_email="111855254+peymanpro@users.noreply.github.com"
            if [ "$GIT_AUTHOR_EMAIL" = "$old_email" ]; then
              export GIT_AUTHOR_NAME="$new_name"
              export GIT_AUTHOR_EMAIL="$new_email"
            fi
            if [ "$GIT_COMMITTER_EMAIL" = "$old_email" ]; then
              export GIT_COMMITTER_NAME="$new_name"
              export GIT_COMMITTER_EMAIL="$new_email"
            fi
          ' --index-filter 'git rm -r --cached --ignore-unmatch .github/workflows/cleanup-punof-contributor.yml' --prune-empty -- main
          git push --force origin "HEAD:main"
